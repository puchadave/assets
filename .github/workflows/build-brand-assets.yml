name: Build brand assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/img/**/logos/svg/**'
      - 'assets/img/**/brand.json'
      - 'scripts/build-assets.py'
      - '.github/workflows/build-brand-assets.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip asset build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libffi-dev fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow==12.2.0 cairosvg==2.8.2

      - name: Generate raster, favicon, app and social assets
        run: python scripts/build-assets.py

      - name: Commit generated assets
        run: |
          git config user.name "webOwie Asset Builder"
          git config user.email "134562787+puchadave@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "build: regenerate brand assets [skip asset build]"
          git push
